<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Retro Host</title>
<style>body{background:#101624;color:#e6efff;font:16px system-ui;max-width:1080px;margin:32px auto;padding:16px}h1{letter-spacing:-1px}button,input{font:inherit;background:#23314a;color:inherit;border:1px solid #60718d;padding:9px;border-radius:6px;margin:4px}canvas{image-rendering:pixelated;width:min(100%,640px);background:#000;border:1px solid #60718d}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:400px;overflow:auto;background:#192236;padding:16px}.error{color:#ffaaaa}</style>
<h1>Nexus Retro Host</h1><p>Local native emulation · Core-owned state history</p><input id="rom" type="file" accept=".gb,.gbc,.sfc,.smc,.nes"><button id="load">Load</button><p><button id="run">Run</button><button id="pause">Pause</button><button id="step">Step</button><button id="reset">Reset</button><button id="save">Save</button><button id="restore">Restore</button><input id="target" type="number" min="0" value="0" aria-label="Rewind frame"><button id="rewind">Rewind</button></p><p id="status">Choose a ROM supported by the installed provider.</p><canvas id="screen" width="160" height="144"></canvas><p>Arrows: direction · Z: B · X: A · Enter: Start · Shift: Select</p><button id="inspect">Inspect Core state</button><pre id="state">Semantic state requires a verified, content-hash-bound profile. Video alone does not identify game actors.</pre>
<script type="module">
import {createPcmPlayback} from '/pcm.js';
const token=location.hash.slice(1),$=id=>document.getElementById(id),pressed=new Set();let running=false,audio=null,playback=null,generation=0;
async function api(name,body={}){const r=await fetch('/api/'+name,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({operationId:crypto.randomUUID(),...body})});const v=await r.json();if(!r.ok)throw Error(v.error);return v;}
function decode(text){return Uint8Array.from(atob(text),c=>c.charCodeAt(0));}
async function frame(){const view=generation,f=await api('step',{actions:[...pressed]});if(view!==generation)return;$('screen').width=f.width;$('screen').height=f.height;$('screen').getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(decode(f.rgba)),f.width,f.height),0,0);$('status').textContent='Frame '+f.sourceFrame;
if(playback&&f.audio)playback.enqueue(decode(f.audio),f.sampleRate);}

async function safe(fn){try{await fn();$('status').className='';}catch(e){running=false;$('status').className='error';$('status').textContent=e.message;}}
$('load').onclick=()=>safe(async()=>{running=false;generation++;const file=$('rom').files[0];if(!file)throw Error('Choose a file');const r=await fetch('/api/load?name='+encodeURIComponent(file.name),{method:'POST',headers:{Authorization:'Bearer '+token,'X-Operation-Id':crypto.randomUUID()},body:file});const v=await r.json();if(!r.ok)throw Error(v.error);playback?.reset();$('status').textContent='Loaded '+file.name;});
$('step').onclick=()=>safe(frame);$('run').onclick=()=>safe(async()=>{audio??=new AudioContext();playback??=createPcmPlayback(audio);await audio.resume();if(running)return;await api('run');running=true;while(running){const t=performance.now();await frame();await new Promise(r=>setTimeout(r,Math.max(0,16.74-(performance.now()-t))));}});$('pause').onclick=()=>safe(async()=>{running=false;await api('pause');playback?.reset();});
for(const name of ['reset','save','restore'])$(name).onclick=()=>safe(async()=>{running=false;generation++;await api(name);playback?.reset();$('status').textContent=name+' complete';});
$('rewind').onclick=()=>safe(async()=>{running=false;generation++;const v=await api('rewind',{frame:Number($('target').value)});playback?.reset();$('status').textContent='Rewound to '+v.sourceFrame;});$('inspect').onclick=()=>safe(async()=>{$('state').textContent=JSON.stringify(await api('state'),null,2);});
const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',z:'b',x:'a',Enter:'start',Shift:'select'};addEventListener('keydown',e=>{if(keys[e.key]){pressed.add(keys[e.key]);e.preventDefault();}});addEventListener('keyup',e=>pressed.delete(keys[e.key]));addEventListener('blur',()=>{pressed.clear();running=false;});
</script></html>
